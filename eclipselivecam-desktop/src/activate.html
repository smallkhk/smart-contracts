<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Activate EclipseLiveCam</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0c0c0e;color:#e8e8f0;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-app-region:drag}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
.logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:1.5rem;box-shadow:0 8px 32px rgba(124,58,237,.45)}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.4rem}
.sub{font-size:.88rem;color:rgba(232,232,240,.4);margin-bottom:2.5rem;text-align:center;max-width:320px;line-height:1.6}
.card{background:#111118;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:2rem;width:100%;max-width:420px;-webkit-app-region:no-drag}
.label{font-size:.78rem;font-weight:600;color:rgba(232,232,240,.5);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem}
input{width:100%;padding:.75rem 1rem;background:#0c0c0e;border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#e8e8f0;font-family:'Segoe UI',sans-serif;font-size:1rem;letter-spacing:.1em;text-align:center;outline:none;transition:.2s;margin-bottom:1.2rem}
input:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.2)}
input.error{border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.15)}
input.ok{border-color:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.15)}
input::placeholder{color:rgba(232,232,240,.2);letter-spacing:.05em}
.btn{width:100%;padding:.8rem;border-radius:10px;border:none;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-family:'Segoe UI',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:.02em}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.msg{margin-top:1rem;font-size:.83rem;text-align:center;min-height:1.2rem}
.msg.err{color:#f87171}
.msg.ok{color:#34d399}
.footer{margin-top:2rem;font-size:.74rem;color:rgba(232,232,240,.2);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🌑</div>
  <h1>EclipseLiveCam</h1>
  <div class="sub">Enter your activation key to unlock the app. Contact support if you need a key.</div>

  <div class="card">
    <div class="label">Activation Key</div>
    <input id="keyInput" type="text" placeholder="ECLPS-XXXXX-XXXXX-XXXXX"
      maxlength="23" oninput="formatKey(this)" onkeydown="onEnter(event)"/>
    <button class="btn" id="activateBtn" onclick="activate()">Activate</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="footer">EclipseLiveCam &copy; 2026</div>
</div>

<script>
const EA = window.eclipseApp;

function formatKey(input) {
  let v = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  const parts = [];
  if (v.length > 0)  parts.push(v.slice(0, 5));
  if (v.length > 5)  parts.push(v.slice(5, 10));
  if (v.length > 10) parts.push(v.slice(10, 15));
  if (v.length > 15) parts.push(v.slice(15, 20));
  input.value = parts.join('-');
  input.classList.remove('error', 'ok');
  document.getElementById('msg').textContent = '';
  document.getElementById('msg').className = 'msg';
}

function onEnter(e) {
  if (e.key === 'Enter') activate();
}

async function activate() {
  const key = document.getElementById('keyInput').value.trim();
  const btn = document.getElementById('activateBtn');
  const msg = document.getElementById('msg');
  const inp = document.getElementById('keyInput');

  if (!key) {
    inp.classList.add('error');
    msg.textContent = 'Please enter your activation key.';
    msg.className = 'msg err';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Validating…';
  msg.textContent = '';
  msg.className = 'msg';

  const result = await EA.activateKey(key);

  if (result.valid) {
    inp.classList.add('ok');
    msg.textContent = '✓ Activated! Loading studio…';
    msg.className = 'msg ok';
    setTimeout(() => EA.activationSuccess(), 1000);
  } else {
    inp.classList.add('error');
    msg.textContent = result.reason || 'Invalid key. Please try again.';
    msg.className = 'msg err';
    btn.disabled = false;
    btn.textContent = 'Activate';
  }
}
</script>
</body>
</html>
