name: Build Silk Road Tweak

on:
  push:
    branches: [ main, master, claude/github-actions-windows-build-e3tfD ]
    paths:
      - 'ios-tweak/**'
      - '.github/workflows/build-tweak.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos dependencies
        run: brew install ldid make

      - name: Set THEOS path
        run: echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Clone Theos
        run: git clone --recursive https://github.com/theos/theos $THEOS

      - name: Download iOS SDK
        run: |
          curl -L "https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz" \
            -o /tmp/sdk.tar.xz
          tar -xJf /tmp/sdk.tar.xz -C $THEOS/sdks

      - name: Build .deb
        working-directory: ios-tweak
        run: gmake package FINALPACKAGE=1
        env:
          THEOS_DEVICE_IP: ""

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusDrop-Auth-deb
          path: ios-tweak/packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Get version
        id: version
        run: echo "ver=$(grep '^Version:' ios-tweak/control | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tweak-v${{ steps.version.outputs.ver }}
          name: NexusDrop Auth v${{ steps.version.outputs.ver }}
          files: ios-tweak/packages/*.deb
          make_latest: true
