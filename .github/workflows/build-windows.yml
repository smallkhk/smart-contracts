name: Build EclipseLiveCam

on:
  push:
    branches: [ main, master, claude/github-actions-windows-build-e3tfD ]
    paths:
      - 'eclipselivecam-desktop/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: eclipselivecam-desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set build version
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='1.0.${{ github.run_number }}';fs.writeFileSync('package.json',JSON.stringify(p,null,2))"

      - name: Install dependencies
        run: npm install

      - name: Build & publish Windows
        run: npm run build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: eclipselivecam-desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set build version
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='1.0.${{ github.run_number }}';fs.writeFileSync('package.json',JSON.stringify(p,null,2))"

      - name: Install dependencies
        run: npm install

      - name: Build & publish macOS
        run: npm run build:mac -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
