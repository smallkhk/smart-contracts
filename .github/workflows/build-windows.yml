name: Build EclipseLiveCam

on:
  push:
    branches: [ main, master, claude/github-actions-windows-build-e3tfD ]
    paths:
      - 'eclipselivecam-desktop/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: eclipselivecam-desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows (x64, ia32, arm64)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: EclipseLiveCam-Windows
          path: eclipselivecam-desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: EclipseLiveCam-Windows
          path: release-files

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: EclipseLiveCam — Latest Build
          body: |
            ## Download EclipseLiveCam for Windows

            | Version | File |
            |---------|------|
            | Windows 64-bit | `EclipseLiveCam Setup *-x64.exe` |
            | Windows 32-bit | `EclipseLiveCam Setup *-ia32.exe` |
            | Windows ARM    | `EclipseLiveCam Setup *-arm64.exe` |
          make_latest: true
          files: release-files/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
