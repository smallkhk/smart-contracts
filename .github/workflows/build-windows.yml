name: Build EclipseLiveCam Windows App

on:
  push:
    branches: [ main, master, claude/github-actions-windows-build-e3tfD ]
    paths:
      - 'eclipselivecam-desktop/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'eclipselivecam-desktop/**'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: eclipselivecam-desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: eclipselivecam-desktop/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EclipseLiveCam-Windows-Installer
          path: eclipselivecam-desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
