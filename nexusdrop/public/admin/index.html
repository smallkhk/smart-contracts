<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexusDrop Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#ccc;font-family:'Segoe UI',sans-serif;min-height:100vh}
/* Login */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#111;border:1px solid #1e1e1e;border-radius:16px;padding:40px;width:340px}
.card h1{color:#fff;font-size:20px;margin-bottom:6px}
.card p{color:#444;font-size:13px;margin-bottom:28px}
/* Panel */
#panel{display:none}
.top{background:#111;border-bottom:1px solid #1a1a1a;padding:16px 32px;display:flex;align-items:center;justify-content:space-between}
.top h1{color:#fff;font-size:17px}
.wrap{max-width:1100px;margin:0 auto;padding:28px 24px}
.stats{display:flex;gap:16px;margin-bottom:28px}
.stat{background:#111;border:1px solid #1a1a1a;border-radius:12px;padding:20px 28px;flex:1}
.stat h3{font-size:26px;color:#fff}
.stat p{font-size:12px;color:#444;margin-top:4px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
.panel{background:#111;border:1px solid #1a1a1a;border-radius:12px;padding:24px}
.panel h2{font-size:12px;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:18px}
input,select{width:100%;padding:10px 14px;background:#171717;border:1px solid #222;border-radius:8px;color:#fff;font-size:14px;outline:none;margin-bottom:10px}
input:focus{border-color:#444}
.row{display:flex;gap:10px;margin-bottom:10px}
.row input,.row select{margin-bottom:0}
button{padding:10px 18px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;background:#fff;color:#000;transition:.15s}
button:hover{background:#e0e0e0}
button.sec{background:#1a1a1a;color:#aaa;border:1px solid #222}
button.sec:hover{background:#222;color:#fff}
button.danger{background:#c0392b;color:#fff}
button.danger:hover{background:#e74c3c}
button.sm{padding:5px 12px;font-size:12px}
.msg{background:#111a11;border:1px solid #1e3a1e;border-radius:8px;padding:10px 16px;color:#5d5;font-size:14px;margin-bottom:20px}
.err-msg{background:#1a1111;border:1px solid #3a1e1e;border-radius:8px;padding:10px 16px;color:#f55;font-size:14px;margin-bottom:20px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;border-bottom:1px solid #1a1a1a;color:#444;font-size:11px;text-transform:uppercase}
td{padding:10px 12px;border-bottom:1px solid #111;color:#aaa}
tr:hover td{background:#0f0f0f}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.on{background:#112211;color:#5d5}.off{background:#221111;color:#c55}
.mono{font-family:monospace;color:#fff;font-size:13px}
.acts{display:flex;gap:6px}
</style>
</head>
<body>

<!-- Login screen -->
<div id="login">
  <div class="card">
    <h1>🔑 NexusDrop</h1>
    <p>Enter your admin key to continue</p>
    <div id="loginErr"></div>
    <input type="password" id="adminKey" placeholder="Admin key" autofocus>
    <button onclick="doLogin()" style="width:100%;padding:13px;margin-top:4px">Sign in</button>
  </div>
</div>

<!-- Admin panel -->
<div id="panel">
  <div class="top">
    <h1>🔑 NexusDrop Admin</h1>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="sec sm" onclick="exportCSV()">Export CSV</button>
      <button class="sec sm" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="wrap">
    <div id="msg"></div>
    <div class="stats">
      <div class="stat"><h3 id="sTotal">—</h3><p>Total keys</p></div>
      <div class="stat"><h3 id="sActive">—</h3><p>Active</p></div>
      <div class="stat"><h3 id="sOff">—</h3><p>Disabled</p></div>
    </div>
    <div class="panels">
      <div class="panel">
        <h2>Generate Keys</h2>
        <input type="number" id="genCount" value="1" min="1" max="100" placeholder="How many?">
        <input type="text" id="genLabel" placeholder="Label (optional)">
        <input type="datetime-local" id="genExpires" title="Expiry — blank = never">
        <button onclick="generate()">Generate</button>
      </div>
      <div class="panel">
        <h2>Add Key Manually</h2>
        <input type="text" id="addKey" placeholder="NEXUS-XXXXX-XXXXX-XXXXX" style="font-family:monospace;text-transform:uppercase">
        <input type="text" id="addLabel" placeholder="Label (optional)">
        <input type="datetime-local" id="addExpires" title="Expiry — blank = never">
        <button onclick="addManual()">Add Key</button>
      </div>
    </div>
    <div class="panel">
      <h2>All Keys (<span id="keyCount">0</span>)</h2>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Key</th><th>Label</th><th>Status</th><th>Activated</th><th>Expires</th><th>Created</th><th>Actions</th></tr></thead>
          <tbody id="keyTable"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
let AKEY = '';

function doLogin() {
  const k = document.getElementById('adminKey').value.trim();
  if (!k) return;
  AKEY = k;
  loadKeys().then(ok => {
    if (ok) {
      document.getElementById('login').style.display = 'none';
      document.getElementById('panel').style.display = 'block';
    } else {
      document.getElementById('loginErr').innerHTML = '<div class="err-msg" style="margin-bottom:14px">Wrong admin key.</div>';
      AKEY = '';
    }
  });
}

function logout() { AKEY=''; location.reload(); }

document.getElementById('adminKey').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function api(method, body) {
  return fetch('/api/keys', {
    method,
    headers: { 'Content-Type': 'application/json', 'x-admin-key': AKEY },
    body: body ? JSON.stringify(body) : undefined
  }).then(r => r.json());
}

async function loadKeys() {
  try {
    const d = await api('GET');
    if (d.error) return false;
    renderKeys(d.keys || []);
    return true;
  } catch { return false; }
}

function renderKeys(keys) {
  const active = keys.filter(k => k.is_active).length;
  document.getElementById('sTotal').textContent  = keys.length;
  document.getElementById('sActive').textContent = active;
  document.getElementById('sOff').textContent    = keys.length - active;
  document.getElementById('keyCount').textContent = keys.length;

  document.getElementById('keyTable').innerHTML = keys.map(k => `
    <tr>
      <td class="mono">${k.key_value}</td>
      <td>${k.label || '—'}</td>
      <td><span class="badge ${k.is_active ? 'on' : 'off'}">${k.is_active ? 'Active' : 'Off'}</span></td>
      <td>${k.activated_at ? k.activated_at.slice(0,10) : '—'}</td>
      <td>${k.expires_at  ? k.expires_at.slice(0,10)  : 'Never'}</td>
      <td>${k.created_at  ? k.created_at.slice(0,10)  : '—'}</td>
      <td><div class="acts">
        <button class="sec sm" onclick="toggle(${k.id})">${k.is_active ? 'Disable' : 'Enable'}</button>
        <button class="danger sm" onclick="del(${k.id})">Delete</button>
      </div></td>
    </tr>
  `).join('');
}

function showMsg(txt, err=false) {
  const el = document.getElementById('msg');
  el.innerHTML = `<div class="${err?'err-msg':'msg'}">${txt}</div>`;
  setTimeout(() => el.innerHTML = '', 4000);
}

async function generate() {
  const count   = document.getElementById('genCount').value;
  const label   = document.getElementById('genLabel').value;
  const expires = document.getElementById('genExpires').value;
  const d = await api('POST', { action:'generate', count, label, expires: expires||null });
  if (d.error) return showMsg(d.error, true);
  showMsg(`Generated ${d.added.length} key(s).`);
  loadKeys();
}

async function addManual() {
  const key_value = document.getElementById('addKey').value.toUpperCase().trim();
  const label     = document.getElementById('addLabel').value;
  const expires   = document.getElementById('addExpires').value;
  if (!key_value) return showMsg('Enter a key value.', true);
  const d = await api('POST', { action:'add', key_value, label, expires: expires||null });
  if (d.error) return showMsg(d.error, true);
  showMsg('Key added.');
  loadKeys();
}

async function toggle(id) {
  await api('POST', { action:'toggle', id });
  loadKeys();
}

async function del(id) {
  if (!confirm('Delete this key?')) return;
  await api('DELETE', { id });
  showMsg('Key deleted.');
  loadKeys();
}

async function exportCSV() {
  const d = await api('GET');
  const keys = d.keys || [];
  const rows = [['Key','Label','Active','Activated','Expires','Created']];
  keys.forEach(k => rows.push([k.key_value, k.label||'', k.is_active?'Yes':'No', k.activated_at||'', k.expires_at||'', k.created_at||'']));
  const csv = rows.map(r => r.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv,' + encodeURIComponent(csv);
  a.download = 'nexusdrop-keys.csv';
  a.click();
}
</script>
</body>
</html>
